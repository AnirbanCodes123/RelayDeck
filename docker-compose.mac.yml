services:
  portal:
    image: relaydeck-portal:mac
    build:
      context: .
      dockerfile: Dockerfile.mac
    environment:
      HOST_PLATFORM: macos
      NVDEC_COMPATIBILITY: ${NVDEC_COMPATIBILITY:-0}
      HOST_METRICS_FILE: /mac-monitor/metrics.json
    volumes:
      - ./.mac-monitor:/mac-monitor:ro
